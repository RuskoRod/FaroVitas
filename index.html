<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farovitas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div id="ambient-layer">
      <div class="star-plane star-plane--far"></div>
      <div class="star-plane star-plane--near"></div>
    </div>
  </div>

  <header>
    <a class="logo" id="logo-home" href="./" aria-label="Farovitas: ir a favoritas">Faro<span>vitas</span></a>
    <div class="search-wrap">
      <input type="text" id="input-busqueda" aria-label="Buscar películas, series, anime" placeholder="Buscar películas, series, anime…">
      <button class="btn-search" id="btn-buscar">Buscar</button>
    </div>
    <div class="header-controls">
      <label class="theme-switch">
        <input type="checkbox" role="switch" id="theme-toggle" aria-label="Modo claro" autocomplete="off">
        <span class="theme-track" aria-hidden="true">
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.3A8.7 8.7 0 0 1 8.7 4a8.7 8.7 0 1 0 11.3 11.3Z"/></svg>
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </span>
      </label>
      <label class="stars-switch" title="Estrellas del fondo">
        <input type="checkbox" role="switch" id="stars-toggle" aria-label="Estrellas del fondo" aria-describedby="stars-hint" autocomplete="off" checked>
        <span class="stars-track" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2" transform="rotate(20 12 12)"/><path d="M11 17.5h.01M3 7a5 5 0 0 1 3-3m15 13a5 5 0 0 1-3 3"/></svg>
        </span>
      </label>
    </div>
    <p class="stars-help" id="stars-help" hidden>
      <span id="stars-hint"></span>
      <a id="stars-open" href="./" target="_blank" rel="noopener" hidden>Abrir en otra pestaña ↗</a>
    </p>
  </header>

  <div class="tabs-bar" id="tabs-bar"></div>

  <main>
    <h2 class="section-title" id="titulo-seccion">favoritas</h2>
    <div id="search-info" style="display:none"></div>
    <div class="grid" id="grid-contenido"></div>
  </main>

  <!-- Editar película -->
  <div class="modal-overlay" id="modal-peli">
    <div class="modal-box">
      <h3 id="modal-peli-titulo">Elemento</h3>
      <div class="modal-group">
        <span class="modal-label">Calificación</span>
        <div class="stars-row" id="stars-container"></div>
      </div>
      <div class="modal-group">
        <span class="modal-label">Mover a carpeta</span>
        <select class="modal-select" id="modal-select-carpeta"></select>
      </div>
      <div class="modal-actions">
        <button class="btn-modal primary" id="btn-guardar-peli">Guardar cambios</button>
        <button class="btn-modal danger" id="btn-eliminar-peli">Eliminar de la colección</button>
        <button class="btn-modal secondary" id="btn-cerrar-modal-peli">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Gestionar carpeta -->
  <div class="modal-overlay" id="modal-carpeta">
    <div class="modal-box">
      <h3 id="modal-carpeta-titulo">Opciones de carpeta</h3>
      <span class="modal-label">Renombrar carpeta</span>
      <input type="text" class="modal-input" id="input-nombre-carpeta" placeholder="Nuevo nombre…">
      <div class="modal-actions">
        <button class="btn-modal primary" id="btn-confirmar-renombrar">Renombrar</button>
        <button class="btn-modal danger" id="btn-confirmar-borrar">Eliminar carpeta</button>
        <button class="btn-modal secondary" id="btn-cerrar-modal-carpeta">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Nueva carpeta -->
  <div class="modal-overlay" id="modal-nueva-carpeta">
    <div class="modal-box">
      <h3>Nueva carpeta</h3>
      <span class="modal-label">Nombre</span>
      <input type="text" class="modal-input" id="input-nueva-carpeta" placeholder="Ej: pendientes, favoritos…">
      <div class="modal-actions">
        <button class="btn-modal primary" id="btn-confirmar-nueva-carpeta">Crear carpeta</button>
        <button class="btn-modal secondary" id="btn-cerrar-nueva-carpeta">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Añadir ítem -->
  <div class="modal-overlay" id="modal-add-item">
    <div class="modal-box">
      <h3>Añadir elemento</h3>
      <span class="modal-label">Título</span>
      <input type="text" class="modal-input" id="input-add-titulo" placeholder="Ej: Evangelion, Dune…">
      <span class="modal-label">Tipo</span>
      <select class="modal-select" id="input-add-tipo">
        <option value="Película">Película</option>
        <option value="Serie">Serie</option>
        <option value="Anime">Anime</option>
        <option value="Documental">Documental</option>
        <option value="Otro">Otro</option>
      </select>
      <span class="modal-label" style="margin-top:14px">URL del poster (opcional)</span>
      <input type="text" class="modal-input" id="input-add-poster" placeholder="https://…">
      <div class="modal-actions">
        <button class="btn-modal primary" id="btn-confirmar-add-item">Añadir</button>
        <button class="btn-modal secondary" id="btn-cerrar-add-item">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- config.js debe cargarse ANTES que app.js -->
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="ambiente.js"></script>
</body>
</html>
